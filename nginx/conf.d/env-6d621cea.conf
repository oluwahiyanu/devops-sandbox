server {
    listen 80;
    server_name localhost 127.0.0.1 host.docker.internal nginx;

    location /env/env-6d621cea/ {
        rewrite ^/env/env-6d621cea/(.*)$ /$1 break;
        proxy_pass http://sandbox-app-env-6d621cea:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Env-ID env-6d621cea;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @env_error_env-6d621cea;
    }

    location /env/env-6d621cea {
        return 301 /env/env-6d621cea/;
    }

    location @env_error_env-6d621cea {
        default_type application/json;
        return 502 '{"error":"environment unreachable","env_id":"env-6d621cea"}';
    }
}
