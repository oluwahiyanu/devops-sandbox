# nginx/nginx.conf
# This is the main Nginx config for the platform.

events {
    worker_connections 1024;
}

http {
    # Access log format includes the upstream so we can see which env was hit
    log_format platform '$time_iso8601 | $status | ${request_time}s | $upstream_addr | $request';
    access_log /var/log/nginx/access.log platform;
    error_log  /var/log/nginx/error.log warn;

    # Default server — returns 404 for unknown paths
    server {
        listen 80 default_server;
        server_name _;
        return 404 '{"error":"environment not found","hint":"check env ID in path"}';
        default_type application/json;
    }

    # Per-environment server blocks are included here.
    include /etc/nginx/conf.d/*.conf;
}


